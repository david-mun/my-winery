project_id = "my-winery"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[studio]
enabled = true
port = 54323
[inbucket]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/callback?type=invite", "http://localhost:3000/auth/callback?type=recovery"]
enable_signup = false
[auth.email]
enable_signup = false
enable_confirmations = true
[auth.email.template.invite]
subject = "My Wine List 초대"
content_path = "./supabase/templates/invite.html"
[auth.email.template.recovery]
subject = "My Wine List 비밀번호 재설정"
content_path = "./supabase/templates/recovery.html"
